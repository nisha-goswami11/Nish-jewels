<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shopping Cart | NISH Jewels</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@500;700&display=swap"
        rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="cart.css">

</head>

<body>

    <nav class="navbar navbar-expand-lg fixed-top shadow-sm bg-white">

        <div class="container">

            <a class="navbar-brand fw-bold" href="#">
                💎 NISH Jewels
            </a>

            <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbar">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse"
                id="navbar">

                <ul class="navbar-nav mx-auto">

                    <li class="nav-item">
                        <a class="nav-link active" href="index.html">Home</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="about.html">About</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="product.html">Products</a>
                    </li>

                    <li class="nav-item">   
                        <a class="nav-link active" href="shop.html">Shop</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="#contact">Contact</a>
                    </li>

                </ul>

                <form class="d-flex me-3">

                    <input class="form-control"
                        type="search"
                        placeholder="Search Jewellery">

                </form>

                

                <div class="d-flex align-items-center gap-3">

                    <a href="wishlist.html" class="position-relative">

                        <i class="bi bi-heart fs-4"></i>

                        <span id="wishlistCount"
                            class="badge bg-danger position-absolute top-0 start-100 translate-middle">
                            0
                        </span>

                    </a>
                    
                    <a href="cart.html" class="position-relative">

                        <i class="bi bi-cart3 fs-4"></i>

                        <span id="cartCount" class="badge bg-primary position-absolute top-0 start-100 translate-middle">
                            0
                        </span>

                    </a>

                    <a href="login.html" class="position-relative">

                    <button class="btn btn-primary rounded-pill px-4">
                        Login
                    </button>
                    </a>

                </div>

            </div>

        </div>

    </nav>


    <!-- ================= Cart Banner ================= -->

    <section class="cart-banner">

        <div class="container text-center">

            <h1>Shopping Cart</h1>

            <p>Review your selected jewellery before checkout.</p>

        </div>

    </section>

    <!-- ================= Cart Section ================= -->

    <section class="cart-section py-5">

        <div class="container">

            <div class="row">

                <!-- Cart Items -->

                <div class="col-lg-8">

                    <div id="cartItems">

                        <!-- Products will be added using JavaScript -->

                    </div>

                </div>

                <!-- Order Summary -->

                <div class="col-lg-4">

                    <div class="order-summary">

                        <h3>Order Summary</h3>

                        <hr>

                        <div class="d-flex justify-content-between">

                            <span>Subtotal</span>

                            <span id="subtotal">₹0</span>

                        </div>

                        <div class="d-flex justify-content-between mt-3">

                            <span>Shipping</span>

                            <span>FREE</span>

                        </div>

                        <hr>

                        <div class="d-flex justify-content-between">

                            <strong>Total</strong>

                            <strong id="total">₹0</strong>

                        </div>

                        <button class="btn checkout-btn w-100 mt-4">

                        <a class="nav-link active" href="checkout.html">Proceed to Checkout</a>

                        </button>

                    </div>

                </div>

            </div>

        </div>

    </section>

    <!-- ================= Empty Cart ================= -->

    <section id="emptyCart" class="text-center py-5 d-none">

        <div class="container">

            <i class="bi bi-cart-x display-1 text-secondary"></i>

            <h2 class="mt-3">

                Your Cart is Empty

            </h2>

            <p>

                Looks like you haven't added any jewellery yet.

            </p>

            <a href="shop.html" class="btn hero-btn">

                Continue Shopping

            </a>

        </div>

    </section>

    <!-- ================= Footer ================= -->

    <!-- Copy your Home Page Footer here -->

    <!-- Bootstrap JS -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Common Functions -->
    
    <script src="common.js"></script>

    <!-- Cart JS -->

    <script src="cart.js"></script>

</body>

</html>
