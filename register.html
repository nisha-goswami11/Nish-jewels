<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | NISH Jewels</title>

    <!-- Bootstrap CSS -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Google Fonts -->

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Playfair+Display:wght@700&display=swap"
        rel="stylesheet">

    <!-- CSS -->

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="register.css">

</head>

<body>

    <!-- Copy your Navbar here -->

    <section class="register-section">

        <div class="container">

            <div class="row justify-content-center">

                <div class="col-lg-6 col-md-8">

                    <div class="register-card">

                        <h2>Create Account</h2>

                        <p>Join NISH Jewels today.</p>

                        <form id="registerForm">

                            <div class="row">

                                <div class="col-md-6 mb-3">

                                    <label>First Name</label>

                                    <input type="text"
                                        class="form-control"
                                        id="firstName"
                                        required>

                                </div>

                                <div class="col-md-6 mb-3">

                                    <label>Last Name</label>

                                    <input type="text"
                                        class="form-control"
                                        id="lastName"
                                        required>

                                </div>

                            </div>

                            <div class="mb-3">

                                <label>Email Address</label>

                                <input type="email"
                                    class="form-control"
                                    id="email"
                                    required>

                            </div>

                            <div class="mb-3">

                                <label>Password</label>

                                <div class="password-box">

                                    <input type="password"
                                        class="form-control"
                                        id="password"
                                        required>

                                    <i class="bi bi-eye-slash"
                                        id="togglePassword"></i>

                                </div>

                            </div>

                            <div class="mb-4">

                                <label>Confirm Password</label>

                                <div class="password-box">

                                    <input type="password"
                                        class="form-control"
                                        id="confirmPassword"
                                        required>

                                    <i class="bi bi-eye-slash"
                                        id="toggleConfirmPassword"></i>

                                </div>

                            </div>

                            <button
                                class="btn register-btn w-100"
                                type="submit">

                                Create Account

                            </button>

                        </form>

                        <div class="login-link">

                            Already have an account?

                            <a href="login.html">

                                Login

                            </a>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="common.js"></script>

    <script src="register.js"></script>

</body>

</html>
