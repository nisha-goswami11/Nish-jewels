<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | NISH Jewels</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Playfair+Display:wght@700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="login.css">

</head>

<body>

    <!-- Copy your Navbar here -->

    <section class="login-section">

        <div class="container">

            <div class="row justify-content-center">

                <div class="col-lg-5 col-md-7">

                    <div class="login-card">

                        <h2>Welcome Back</h2>

                        <p>Login to your NISH Jewels account.</p>

                        <form id="loginForm">

                            <div class="mb-3">

                                <label>Email Address</label>

                                <input
                                    type="email"
                                    class="form-control"
                                    id="email"
                                    placeholder="Enter your email"
                                    required>

                            </div>

                            <div class="mb-3">

                                <label>Password</label>

                                <div class="password-box">

                                    <input
                                        type="password"
                                        class="form-control"
                                        id="password"
                                        placeholder="Enter your password"
                                        required>

                                    <i class="bi bi-eye-slash"
                                        id="togglePassword"></i>

                                </div>

                            </div>

                            <div class="d-flex justify-content-between mb-4">

                                <div>

                                    <input
                                        type="checkbox"
                                        id="remember">

                                    <label for="remember">

                                        Remember Me

                                    </label>

                                </div>

                                <a href="#">

                                    Forgot Password?

                                </a>

                            </div>

                            <button
                                class="btn login-btn w-100"
                                type="submit">

                                Login

                            </button>

                        </form>

                        <div class="register-link">

                            Don't have an account?

                            <a href="register.html">

                                Register

                            </a>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </section>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>   

    <script src="common.js"></script>

    <script src="login.js"></script>

</body>

</html>
