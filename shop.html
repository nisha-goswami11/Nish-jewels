<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NISH Jewels | Shop</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@500;700&display=swap"
        rel="stylesheet">

    <!-- Main CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Shop CSS -->
    <link rel="stylesheet" href="shop.css">

</head>

<body>

    <!-- ================= Navbar ================= -->

        <nav class="navbar navbar-expand-lg fixed-top shadow-sm bg-white">

        <div class="container">

            <a class="navbar-brand fw-bold" href="#">
                💎 NISH Jewels
            </a>

            <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbar">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse"
                id="navbar">

                <ul class="navbar-nav mx-auto">

                    <li class="nav-item">
                        <a class="nav-link active" href="index.html">Home</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="about.html">About</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="product.html">Products</a>
                    </li>

                    <li class="nav-item">   
                        <a class="nav-link active" href="shop.html">Shop</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="#contact">Contact</a>
                    </li>

                </ul>

                <form class="d-flex me-3">

                    <input class="form-control"
                        type="search"
                        placeholder="Search Jewellery">

                </form>

                

                <div class="d-flex align-items-center gap-3">

                    <a href="wishlist.html" class="position-relative">

                        <i class="bi bi-heart fs-4"></i>

                        <span id="wishlistCount"
                            class="badge bg-danger position-absolute top-0 start-100 translate-middle">
                            0
                        </span>

                    </a>
                    
                    <a href="cart.html" class="position-relative">

                        <i class="bi bi-cart3 fs-4"></i>

                        <span id="cartCount" class="badge bg-primary position-absolute top-0 start-100 translate-middle">
                            0
                        </span>

                    </a>

                    <a href="login.html" class="position-relative">

                    <button class="btn btn-primary rounded-pill px-4">
                        Login
                    </button>
                    </a>

                </div>

            </div>

        </div>

    </nav>
    
    <!-- ================= Banner ================= -->

    <section class="shop-banner">

        <div class="container text-center">

            <h1>Our Jewellery Collection</h1>

            <p>
                Explore beautiful jewellery for every occasion.
            </p>

        </div>

    </section>

    <!-- ================= Search & Filter ================= -->

    <section class="shop-controls py-5">

        <div class="container">

            <div class="row g-3">

                <div class="col-lg-4">

                    <input type="text"
                        class="form-control"
                        id="searchInput"
                        placeholder="Search Products...">

                </div>

                <div class="col-lg-4">

                    <select class="form-select"
                        id="categoryFilter">

                        <option value="all">All Categories</option>

                        <option value="Ring">Rings</option>

                        <option value="Necklace">Necklaces</option>

                        <option value="Bracelet">Bracelets</option>

                        <option value="Earrings">Earrings</option>

                    </select>

                </div>

                <div class="col-lg-4">

                    <select class="form-select"
                        id="sortProducts">

                        <option value="default">
                            Sort By
                        </option>

                        <option value="low">
                            Price Low to High
                        </option>

                        <option value="high">
                            Price High to Low
                        </option>

                    </select>

                </div>

            </div>

        </div>

    </section>

    <!-- ================= Products ================= -->

    <section class="products py-5">

        <div class="container">

            <div class="row g-4"
                id="productContainer">

                <!-- Products will come from JavaScript -->

            </div>

        </div>

    </section>

    <!-- ================= Footer ================= -->

    <footer class="footer">

        <div class="container text-center py-4">

            <h4>💎 NISH Jewels</h4>

            <p>
                Crafted with love & elegance.
            </p>

            <hr>

            <p>

                © 2026 NISH Jewels. All Rights Reserved.

            </p>

        </div>

    </footer>

    <!-- Bootstrap JS -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Shop JS -->

    <script src="common.js"></script>

    <script src="shop.js"></script>

</body>

</html>
