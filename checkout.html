<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checkout | NISH Jewels</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@500;700&display=swap"
        rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="checkout.css">

</head>

<body>

    <!-- ==========================
            NAVBAR
    =========================== -->

    <nav class="navbar navbar-expand-lg fixed-top shadow-sm bg-white">

        <div class="container">

            <a class="navbar-brand fw-bold" href="#">
                💎 NISH Jewels
            </a>

            <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbar">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse"
                id="navbar">

                <ul class="navbar-nav mx-auto">

                    <li class="nav-item">
                        <a class="nav-link active" href="index.html">Home</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="about.html">About</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="product.html">Products</a>
                    </li>

                    <li class="nav-item">   
                        <a class="nav-link active" href="shop.html">Shop</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="#contact">Contact</a>
                    </li>

                </ul>

                <form class="d-flex me-3">

                    <input class="form-control"
                        type="search"
                        placeholder="Search Jewellery">

                </form>

                

                <div class="d-flex align-items-center gap-3">

                    <a href="wishlist.html" class="position-relative">

                        <i class="bi bi-heart fs-4"></i>

                        <span id="wishlistCount"
                            class="badge bg-danger position-absolute top-0 start-100 translate-middle">
                            0
                        </span>

                    </a>
                    
                    <a href="cart.html" class="position-relative">

                        <i class="bi bi-cart3 fs-4"></i>

                        <span id="cartCount" class="badge bg-primary position-absolute top-0 start-100 translate-middle">
                            0
                        </span>

                    </a>

                    <a href="login.html" class="position-relative">

                    <button class="btn btn-primary rounded-pill px-4">
                        Login
                    </button>
                    </a>

                </div>

            </div>

        </div>

    </nav>

    <!-- ==========================
        CHECKOUT BANNER
    =========================== -->

    <section class="checkout-banner">

        <div class="container text-center">

            <h1>Checkout</h1>

            <p>Complete your order securely.</p>

        </div>

    </section>



    <!-- ==========================
            CHECKOUT SECTION
    =========================== -->

    <section class="checkout-section py-5">

        <div class="container">

            <div class="row">

                <!-- Billing Details -->

                <div class="col-lg-7">

                    <div class="checkout-card">

                        <h3>Billing Details</h3>

                        <form id="checkoutForm">

                            <div class="row">

                                <div class="col-md-6 mb-3">

                                    <label>First Name</label>

                                    <input
                                        type="text"
                                        class="form-control"
                                        id="firstName"
                                        required>

                                </div>

                                <div class="col-md-6 mb-3">

                                    <label>Last Name</label>

                                    <input
                                        type="text"
                                        class="form-control"
                                        id="lastName"
                                        required>

                                </div>

                            </div>

                            <div class="mb-3">

                                <label>Email Address</label>

                                <input
                                    type="email"
                                    class="form-control"
                                    id="email"
                                    required>

                            </div>

                            <div class="mb-3">

                                <label>Phone Number</label>

                                <input
                                    type="tel"
                                    class="form-control"
                                    id="phone"
                                    required>

                            </div>

                            <div class="mb-3">

                                <label>Address</label>

                                <textarea
                                    class="form-control"
                                    rows="3"
                                    id="address"
                                    required></textarea>

                            </div>

                            <div class="row">

                                <div class="col-md-6 mb-3">

                                    <label>City</label>

                                    <input
                                        type="text"
                                        class="form-control"
                                        id="city"
                                        required>

                                </div>

                                <div class="col-md-6 mb-3">

                                    <label>PIN Code</label>

                                    <input
                                        type="text"
                                        class="form-control"
                                        id="pin"
                                        required>

                                </div>

                            </div>

                        </form>

                    </div>

                </div>



                <!-- Order Summary -->

                <div class="col-lg-5">

                    <div class="checkout-card">

                        <h3>Your Order</h3>

                        <hr>

                        <div id="checkoutItems">

                            <!-- JS will display cart items -->

                        </div>

                        <hr>

                        <div class="d-flex justify-content-between">

                            <span>Subtotal</span>

                            <span id="subtotal">₹0</span>

                        </div>

                        <div class="d-flex justify-content-between mt-2">

                            <span>Shipping</span>

                            <span>FREE</span>

                        </div>

                        <hr>

                        <div class="d-flex justify-content-between">

                            <strong>Total</strong>

                            <strong id="total">₹0</strong>

                        </div>



                        <!-- Payment -->

                        <div class="payment-method mt-4">

                            <h5>Payment Method</h5>

                            <div class="form-check">

                                <input
                                    class="form-check-input"
                                    type="radio"
                                    name="payment"
                                    checked>

                                <label class="form-check-label">

                                    Cash On Delivery

                                </label>

                            </div>

                            <div class="form-check">

                                <input
                                    class="form-check-input"
                                    type="radio"
                                    name="payment">

                                <label class="form-check-label">

                                    Credit / Debit Card

                                </label>

                            </div>

                            <div class="form-check">

                                <input
                                    class="form-check-input"
                                    type="radio"
                                    name="payment">

                                <label class="form-check-label">

                                    UPI Payment

                                </label>

                            </div>

                        </div>

                        <button class="btn place-order-btn w-100 mt-4" id="placeOrder" type="button">

                             Place Order

                        </button>

                    </div>

                </div>

            </div>

        </div>

    </section>



    <!-- ==========================
            FOOTER
    =========================== -->

    <div class="copyright">

        <div class="container">

            <div class="row align-items-center">

                <!-- Left Side -->

                <div class="col-md-6 text-center text-md-start">

                    <p class="mb-0">
                        © 2026 NISH Jewels. All Rights Reserved.
                    </p>

                </div>

                <!-- Right Side -->

                <div class="col-md-6 text-center text-md-end">

                    <a href="#">Privacy Policy</a>

                    <span>|</span>

                    <a href="#">Terms & Conditions</a>

                    <span>|</span>

                    <a href="#">Sitemap</a>

                </div>

            </div>

        </div>

    </div>



    <!-- Bootstrap JS -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Checkout JS -->

    <script src="common.js"></script>

    <script src="checkout.js"></script>

</body>

</html>
